name: Deploy Backend to PROD EC2

on:
  push:
    branches: [prod]
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build-check:
    name: TypeScript build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build

  deploy:
    name: Deploy to prod EC2
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            git fetch origin
            git checkout prod
            git pull origin prod
            npm install
            npm run build
            pm2 restart vertiche-api || pm2 start dist/index.js --name vertiche-api --node-args="-r dotenv/config"
            pm2 save